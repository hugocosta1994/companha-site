<!doctype html>
<html lang="pt-PT">
<head><script src="compat.js"></script><link rel="preload" href="data/catalogo.json" as="fetch" crossorigin="anonymous"><link rel="preload" href="data/puzzles.json" as="fetch" crossorigin="anonymous"><link rel="preload" href="data/diarios.json" as="fetch" crossorigin="anonymous"><link rel="preload" href="data/curados.json" as="fetch" crossorigin="anonymous">
